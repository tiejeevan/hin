name = "konnect"
pages_build_output_dir = "dist"
compatibility_date = "2024-05-24"

# Pages Functions runtime bindings for _worker.js (bot OG + sitemap proxy).
# SITE_URL / API_PUBLIC_URL — also used as Vite build fallback when VITE_* unset in CI.
# API_URL is the internal fetch target only (browser uses VITE_API_URL / API_PUBLIC_URL).
[vars]
SITE_URL = "https://hingot.com"
API_PUBLIC_URL = "https://hingot.com"
API_URL = "https://hin.tiejeevan.workers.dev"
