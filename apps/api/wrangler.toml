name = "hin"
main = "src/index.ts"
compatibility_date = "2024-05-24"
# Keep workers.dev for Pages _worker.js internal API fetch (same-zone custom-domain fetch loops).
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hin-d1"
database_id = "cca6c374-98ad-4fb7-9dca-c2b2c5c43d75"
migrations_dir = "../../packages/db/migrations"

[durable_objects]
bindings = [
  { name = "REALTIME_DO", class_name = "RealtimeDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeDO"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gmart"

# Same-origin API on hingot.com (Pages serves SPA; Worker handles API/WS/sitemap).
[[routes]]
pattern = "hingot.com/api/*"
zone_name = "hingot.com"

[[routes]]
pattern = "hingot.com/ws"
zone_name = "hingot.com"

[[routes]]
pattern = "hingot.com/sitemap.xml"
zone_name = "hingot.com"

[vars]
# Production public origins (override locally via apps/api/.dev.vars).
SITE_URL = "https://hingot.com"
API_PUBLIC_URL = "https://hingot.com"
GOOGLE_CLIENT_ID = "374278266123-6i29t1ve6t76cdb6vsvumvn4nghonpd8.apps.googleusercontent.com"
# Add via `wrangler secret` / dashboard (do not commit real values):
# OCI_SMTP_HOST, OCI_SMTP_PORT, OCI_SMTP_USERNAME, OCI_SMTP_PASSWORD,
# OTP_PEPPER, JWT_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT,
# CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, REALTIMEKIT_APP_ID
REALTIMEKIT_DM_PRESET = "group_call_participant"
REALTIMEKIT_AUDIO_PRESET = "group_call_participant"
