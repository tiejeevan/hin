name = "hin"
main = "src/index.ts"
compatibility_date = "2024-05-24"

[[d1_databases]]
binding = "DB"
database_name = "hin-d1"
database_id = "cca6c374-98ad-4fb7-9dca-c2b2c5c43d75"
migrations_dir = "../../packages/db/migrations"

[durable_objects]
bindings = [
  { name = "REALTIME_DO", class_name = "RealtimeDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeDO"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gmart"

[vars]
# SITE_URL / API_PUBLIC_URL — set in Cloudflare dashboard for production (e.g. https://hingot.com).
# For local dev, add to apps/api/.dev.vars (see .dev.vars.example).
GOOGLE_CLIENT_ID = "374278266123-6i29t1ve6t76cdb6vsvumvn4nghonpd8.apps.googleusercontent.com"
# Add via `wrangler secret` / dashboard (do not commit real values):
# OCI_SMTP_HOST, OCI_SMTP_PORT, OCI_SMTP_USERNAME, OCI_SMTP_PASSWORD,
# OTP_PEPPER, JWT_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
